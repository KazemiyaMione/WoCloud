name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 1.0.0，留空则用本次提交短 SHA）
        required: false

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  package:
    name: 打包并发布
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 解析版本号
        id: ver
        shell: pwsh
        run: |
          $raw = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($raw)) { $raw = "${{ github.ref_name }}".TrimStart('v') }
          if ($raw -notmatch '^\d+\.\d+\.\d+') { $raw = "0.0.${{ github.run_number }}" }
          "value=$raw" >> $env:GITHUB_OUTPUT
          Write-Host "版本: $raw"

      - name: 单元测试
        run: |
          dotnet restore tests/WoCloud.Client.Tests/WoCloud.Client.Tests.csproj
          dotnet run --project tests/WoCloud.Client.Tests -c Release --no-restore

      - name: 发布（self-contained win-x64）
        run: >
          dotnet publish src/WoCloud.App/WoCloud.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:Version=${{ steps.ver.outputs.value }}
          -o publish

      - name: 打包 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zip = "dist/WoCloud-${{ steps.ver.outputs.value }}-win-x64.zip"
          Compress-Archive -Path publish/* -DestinationPath $zip -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          "zip: $zip ($mb MB)" | Tee-Object -Append -FilePath $env:GITHUB_STEP_SUMMARY

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: WoCloud-${{ steps.ver.outputs.value }}-win-x64
          path: dist/*.zip
          retention-days: 14

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: WoCloud v${{ steps.ver.outputs.value }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.value) }}
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ### 下载

            解压 `WoCloud-*-win-x64.zip` 后运行 `WoCloud.App.exe`，无需安装 .NET 运行时。

            - 系统要求：Windows 10 1809 及以上 / Windows 11，x64
            - 首次启动会进入登录页，支持扫码、短信、Token 直通三种方式

            > 本项目为第三方非官方客户端，仅供个人学习与自用；请遵守服务提供方的用户协议。
